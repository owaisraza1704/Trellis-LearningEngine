[project]
name = "trellis-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlmodel>=0.0.24,<0.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "openai>=1.75,<3", "httpx>=0.28,<1", "pypdf>=5,<7",
  "langchain-text-splitters>=0.3,<2", "trafilatura>=2,<3", "ddgs>=9,<10",
  "reportlab>=4,<5", "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pymupdf>=1.25,<2"]
evaluation = [
    "deepeval==4.2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:deepeval"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
